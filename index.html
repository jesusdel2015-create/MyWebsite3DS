<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3DS Unit Converter</title>
<style type="text/css">
body {
    background-color: #e6e6e6;
    color: #222222;
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
}

#container {
    width: 300px;
    margin: 0 auto;
    padding: 5px;
    background-color: #ffffff;
    border: 2px solid #888888;
}

h1 {
    font-size: 18px;
    margin: 5px 0 10px 0;
    color: #0055aa;
}

.tab-table {
    width: 100%;
    margin-bottom: 10px;
}

.tab-btn {
    width: 32%;
    font-size: 14px;
    font-weight: bold;
    padding: 8px 0;
    background-color: #dddddd;
    border: 1px solid #999999;
    color: #333333;
}

.tab-active {
    background-color: #0055aa;
    color: #ffffff;
}

.panel {
    display: none;
    background-color: #f9f9f9;
    border: 1px solid #cccccc;
    padding: 10px 5px;
}

.panel-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
}

.input-box {
    width: 180px;
    font-size: 20px;
    padding: 5px;
    text-align: center;
    border: 1px solid #777777;
}

.unit-label {
    font-size: 16px;
    font-weight: bold;
    margin-top: 5px;
    margin-bottom: 10px;
}

.swap-btn {
    width: 200px;
    font-size: 14px;
    font-weight: bold;
    padding: 8px 0;
    margin: 5px 0;
    background-color: #e0e0e0;
    border: 1px solid #777777;
}

.result-box {
    margin-top: 10px;
    padding: 8px;
    background-color: #e8f4ff;
    border: 1px solid #99bbee;
    font-size: 18px;
    font-weight: bold;
    color: #003366;
}
</style>
</head>
<body>

<div id="container">
    <h1>UNIT CONVERTER</h1>

    <!-- Navigation Tabs -->
    <table class="tab-table" cellSpacing="2" cellPadding="0">
        <tr>
            <td width="33%">
                <button id="tab-temp" class="tab-btn tab-active" onclick="switchTab('temp')">Temp</button>
            </td>
            <td width="33%">
                <button id="tab-len" class="tab-btn" onclick="switchTab('len')">Length</button>
            </td>
            <td width="34%">
                <button id="tab-weight" class="tab-btn" onclick="switchTab('weight')">Weight</button>
            </td>
        </tr>
    </table>

    <!-- Temperature Panel -->
    <div id="panel-temp" class="panel" style="display: block;">
        <div class="panel-title" id="temp-title">Celsius to Fahrenheit</div>
        <input type="text" id="temp-input" class="input-box" onkeyup="calcTemp()" onchange="calcTemp()"><br>
        <div class="unit-label" id="temp-unit-in">&deg;C</div>
        <button class="swap-btn" onclick="swapTemp()">&#8645; Switch Units</button>
        <div class="result-box" id="temp-result">Result: ---</div>
    </div>

    <!-- Length Panel -->
    <div id="panel-len" class="panel">
        <div class="panel-title" id="len-title">Centimeters to Inches</div>
        <input type="text" id="len-input" class="input-box" onkeyup="calcLen()" onchange="calcLen()"><br>
        <div class="unit-label" id="len-unit-in">cm</div>
        <button class="swap-btn" onclick="swapLen()">&#8645; Switch Units</button>
        <div class="result-box" id="len-result">Result: ---</div>
    </div>

    <!-- Weight Panel -->
    <div id="panel-weight" class="panel">
        <div class="panel-title" id="weight-title">Kilograms to Pounds</div>
        <input type="text" id="weight-input" class="input-box" onkeyup="calcWeight()" onchange="calcWeight()"><br>
        <div class="unit-label" id="weight-unit-in">kg</div>
        <button class="swap-btn" onclick="swapWeight()">&#8645; Switch Units</button>
        <div class="result-box" id="weight-result">Result: ---</div>
    </div>
</div>

<script type="text/javascript">
// State variables for unit directions (true = metric to imperial, false = imperial to metric)
var isCtoF = true;
var isCmToIn = true;
var isKgToLb = true;

function switchTab(tab) {
    document.getElementById('panel-temp').style.display = 'none';
    document.getElementById('panel-len').style.display = 'none';
    document.getElementById('panel-weight').style.display = 'none';

    document.getElementById('tab-temp').className = 'tab-btn';
    document.getElementById('tab-len').className = 'tab-btn';
    document.getElementById('tab-weight').className = 'tab-btn';

    if (tab === 'temp') {
        document.getElementById('panel-temp').style.display = 'block';
        document.getElementById('tab-temp').className = 'tab-btn tab-active';
    } else if (tab === 'len') {
        document.getElementById('panel-len').style.display = 'block';
        document.getElementById('tab-len').className = 'tab-btn tab-active';
    } else if (tab === 'weight') {
        document.getElementById('panel-weight').style.display = 'block';
        document.getElementById('tab-weight').className = 'tab-btn tab-active';
    }
}

// Temperature Logic
function swapTemp() {
    isCtoF = !isCtoF;
    if (isCtoF) {
        document.getElementById('temp-title').innerHTML = 'Celsius to Fahrenheit';
        document.getElementById('temp-unit-in').innerHTML = '&deg;C';
    } else {
        document.getElementById('temp-title').innerHTML = 'Fahrenheit to Celsius';
        document.getElementById('temp-unit-in').innerHTML = '&deg;F';
    }
    calcTemp();
}

function calcTemp() {
    var val = parseFloat(document.getElementById('temp-input').value);
    var resBox = document.getElementById('temp-result');
    if (isNaN(val)) {
        resBox.innerHTML = 'Result: ---';
        return;
    }
    var res = 0;
    if (isCtoF) {
        res = (val * 9 / 5) + 32;
        resBox.innerHTML = res.toFixed(2) + ' &deg;F';
    } else {
        res = (val - 32) * 5 / 9;
        resBox.innerHTML = res.toFixed(2) + ' &deg;C';
    }
}

// Length Logic
function swapLen() {
    isCmToIn = !isCmToIn;
    if (isCmToIn) {
        document.getElementById('len-title').innerHTML = 'Centimeters to Inches';
        document.getElementById('len-unit-in').innerHTML = 'cm';
    } else {
        document.getElementById('len-title').innerHTML = 'Inches to Centimeters';
        document.getElementById('len-unit-in').innerHTML = 'in';
    }
    calcLen();
}

function calcLen() {
    var val = parseFloat(document.getElementById('len-input').value);
    var resBox = document.getElementById('len-result');
    if (isNaN(val)) {
        resBox.innerHTML = 'Result: ---';
        return;
    }
    var res = 0;
    if (isCmToIn) {
        res = val * 0.393701;
        resBox.innerHTML = res.toFixed(2) + ' in';
    } else {
        res = val * 2.54;
        resBox.innerHTML = res.toFixed(2) + ' cm';
    }
}

// Weight Logic
function swapWeight() {
    isKgToLb = !isKgToLb;
    if (isKgToLb) {
        document.getElementById('weight-title').innerHTML = 'Kilograms to Pounds';
        document.getElementById('weight-unit-in').innerHTML = 'kg';
    } else {
        document.getElementById('weight-title').innerHTML = 'Pounds to Kilograms';
        document.getElementById('weight-unit-in').innerHTML = 'lbs';
    }
    calcWeight();
}

function calcWeight() {
    var val = parseFloat(document.getElementById('weight-input').value);
    var resBox = document.getElementById('weight-result');
    if (isNaN(val)) {
        resBox.innerHTML = 'Result: ---';
        return;
    }
    var res = 0;
    if (isKgToLb) {
        res = val * 2.20462;
        resBox.innerHTML = res.toFixed(2) + ' lbs';
    } else {
        res = val * 0.453592;
        resBox.innerHTML = res.toFixed(2) + ' kg';
    }
}
</script>

</body>
</html>
